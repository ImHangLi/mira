[package]
name = "mira-cli"
description = "The mira command-line entry point"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "mira"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
mira-client = { path = "../mira-client" }
mira-host = { path = "../mira-host" }
mira-protocol = { path = "../mira-protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "io-util", "signal"] }
mira-tui = { path = "../mira-tui" }

[lints]
workspace = true
