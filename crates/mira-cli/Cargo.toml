[package]
name = "mira-cli"
description = "The mira command-line entry point"
version = "0.9.0"
edition = "2024"

[[bin]]
name = "mira"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
mira-client = { version = "0.9.0", path = "../mira-client" }
mira-host = { version = "0.9.0", path = "../mira-host" }
mira-protocol = { version = "0.9.0", path = "../mira-protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "io-util", "signal"] }
mira-tui = { version = "0.9.0", path = "../mira-tui" }

[lints]
workspace = true
