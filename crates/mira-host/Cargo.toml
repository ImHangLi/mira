[package]
name = "mira-host"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.23.1"
dotenvy = "0.15.7"
getrandom = "0.3"
hex = "0.4.3"
hmac = "0.13.0"
jsonschema = { version = "0.58.0", default-features = false }
mira-protocol = { version = "0.9.0", path = "../mira-protocol" }
notify = "8.2.0"
portable-pty = "0.9.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1.1.5", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "process", "signal", "fs"] }
vt100 = "0.16.2"

[lints]
workspace = true
