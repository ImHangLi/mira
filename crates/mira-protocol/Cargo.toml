[package]
name = "mira-protocol"
version = "0.8.1"
edition = "2024"

[dependencies]
base64 = "0.23.1"
hex = "0.4.3"
jsonschema = { version = "0.58.0", default-features = false }
rustix = { version = "1.1.5", features = ["process", "fs"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_jcs = "0.2.0"
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
sha2 = "0.11.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros", "local-offset"] }
uuid = { version = "1.26.1", features = ["v4"] }

[lints]
workspace = true
