[package]
name = "mira-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
crossterm = "0.29.0"
mira-client = { path = "../mira-client" }
mira-protocol = { path = "../mira-protocol" }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
rustix = { version = "1.1.5", features = ["event", "process"] }
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "process", "io-util"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[lints]
workspace = true
